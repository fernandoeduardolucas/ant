# -----------------------------------------------------------------------------
# Configuracao de experiencias para Algoritmo Genetico (AG)
# Trabalho pratico: variar parametros e comparar performance.
#
# Cada propriedade abaixo aceita uma lista separada por virgulas.
# O runner executa o produto cartesiano de todas as listas.
# -----------------------------------------------------------------------------

# Pasta com todas as instancias a resolver.
genetic.instances.dir=docs/inst_test/instancias

# Tamanho da populacao.
population=30,50,80

# Numero maximo de geracoes.
generations=100,300,500

# Taxa de cruzamento de dois pontos.
crossoverRate=0.75,0.85,0.95

# Taxa de mutacao bit-flip.
mutationRate=0.001,0.005,0.01

# Numero de individuos preservados por elitismo.
eliteSize=1,3,5

# Tamanho do torneio usado na selecao.
tournamentSize=2,3,5

# Limite de geracoes sem melhoria para paragem por estagnacao.
stagnation=20,50,100

# Sementes usadas para garantir reprodutibilidade.
seed=4,12,202

# Numero de threads usadas para executar a grelha em paralelo.
parallelism=1

# Caminho base de saida; os relatorios do AG sao gerados nesta pasta.
genetic.output.csv=results/genetic/ag_resultados.csv
